services:
  # Web Application Service (Django + Gunicorn)
  - type: web
    name: safarisacco-web
    env: python
    region: oregon
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: gunicorn sacco_booking.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: safarisacco-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: safarisacco-redis
          property: connectionString

  # Celery Async Worker Service
  - type: worker
    name: safarisacco-celery-worker
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A sacco_booking worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: safarisacco-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: safarisacco-redis
          property: connectionString

  # Redis In-Memory Service (Broker for Celery)
  - type: redis
    name: safarisacco-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction

databases:
  # PostgreSQL Database Service
  - name: safarisacco-db
    region: oregon
    plan: starter
    databaseName: safarisacco
    user: safarisacco_user
